name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk \
             app/build/outputs/apk/debug/BibleDrillsPractice-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BibleDrillsPractice-WebView-debug
          path: app/build/outputs/apk/debug/BibleDrillsPractice-debug.apk
          if-no-files-found: error

      - name: Update Debug Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="debug-latest"
          APK="app/build/outputs/apk/debug/BibleDrillsPractice-debug.apk"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete-asset "$TAG" "BibleDrillsPractice-debug.apk" --yes || true
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" \
              --title "Debug Build" \
              --notes "Latest automatically generated debug APK." \
              --prerelease
          fi