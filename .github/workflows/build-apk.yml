name: Build APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      # ---------------------------------------------------------
      # DEBUG BUILD
      # ---------------------------------------------------------

      - name: Build debug APK
        if: ${{ github.ref_type == 'branch' || github.event_name == 'workflow_dispatch' }}
        run: |
          gradle assembleDebug \
            -PVERSION_CODE=${{ github.run_number }} \
            -PVERSION_NAME=debug \
            --no-daemon

      - name: Rename debug APK
        if: ${{ github.ref_type == 'branch' || github.event_name == 'workflow_dispatch' }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk \
             app/build/outputs/apk/debug/BibleDrillsPractice-debug.apk

      - name: Upload debug APK artifact
        if: ${{ github.ref_type == 'branch' || github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: BibleDrillsPractice-WebView-debug
          path: app/build/outputs/apk/debug/BibleDrillsPractice-debug.apk
          if-no-files-found: error

      - name: Update Debug Release
        if: ${{ github.ref_type == 'branch' || github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="debug-latest"
          APK="app/build/outputs/apk/debug/BibleDrillsPractice-debug.apk"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete-asset "$TAG" "BibleDrillsPractice-debug.apk" --yes || true
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" \
              --title "Debug Build" \
              --notes "Latest automatically generated debug APK." \
              --prerelease
          fi

      # ---------------------------------------------------------
      # RELEASE BUILD
      # ---------------------------------------------------------

      - name: Set release version
        if: ${{ github.ref_type == 'tag' }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          echo "Release version: $VERSION"
          echo "Version code: $GITHUB_RUN_NUMBER"

      - name: Disable JavaScript debug mode
        if: ${{ github.ref_type == 'tag' }}
        run: |
          sed -i 's/export const DEBUG = true;/export const DEBUG = false;/' assets/config.js

          echo "DEBUG setting:"
          grep "export const DEBUG" assets/config.js

      - name: Prepare release signing
        if: ${{ github.ref_type == 'tag' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore

      - name: Build release APK
        if: ${{ github.ref_type == 'tag' }}
        env:
          RELEASE_STORE_FILE: release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle assembleRelease \
            -PVERSION_CODE=${{ github.run_number }} \
            -PVERSION_NAME="$VERSION" \
            --no-daemon

      - name: Rename release APK
        if: ${{ github.ref_type == 'tag' }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/release/BibleDrillsPractice-${VERSION}.apk

      - name: Upload release APK artifact
        if: ${{ github.ref_type == 'tag' }}
        uses: actions/upload-artifact@v4
        with:
          name: BibleDrillsPractice-${{ env.VERSION }}
          path: app/build/outputs/apk/release/BibleDrillsPractice-${{ env.VERSION }}.apk
          if-no-files-found: error

      - name: Attach APK to GitHub Release
        if: ${{ github.ref_type == 'tag' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          APK="app/build/outputs/apk/release/BibleDrillsPractice-${VERSION}.apk"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub Release $TAG already exists."
            gh release upload "$TAG" "$APK" --clobber
          else
            echo "GitHub Release $TAG does not exist. Creating it."

            gh release create "$TAG" "$APK" \
              --title "Bible Drills Practice ${VERSION}" \
              --notes "Bible Drills Practice ${VERSION}."
          fi