plugins {
    id 'com.android.application'
}

android {
    namespace 'com.twaddler.bdp'
    compileSdk 35

    defaultConfig {
        applicationId 'com.twaddler.bdp'
        minSdk 23
        targetSdk 35

        versionCode project.findProperty("VERSION_CODE")?.toInteger() ?: 1
        versionName project.findProperty("VERSION_NAME") ?: "0.0.0"
    }

    signingConfigs {
        release {
            def keystoreFile = System.getenv("RELEASE_STORE_FILE")
    
            if (keystoreFile) {
                storeFile rootProject.file(keystoreFile)
                storePassword System.getenv("RELEASE_STORE_PASSWORD")
                keyAlias System.getenv("RELEASE_KEY_ALIAS")
                keyPassword System.getenv("RELEASE_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}