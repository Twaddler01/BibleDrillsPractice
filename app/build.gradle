plugins {
    id 'com.android.application'
}

android {
    namespace '...'
    compileSdk 35

    defaultConfig {
        applicationId '...'
        minSdk 23
        targetSdk 35

        versionCode project.findProperty("VERSION_CODE")?.toInteger() ?: 1
        versionName project.findProperty("VERSION_NAME") ?: "0.0.0"
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}